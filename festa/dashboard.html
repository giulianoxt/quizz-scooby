<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da Turma · interno</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--night:#221a54;--night2:#181140;--cream:#fff4d6;--ink:#3a2518;--green:#5dc94f;--green-dark:#3d9a31;--gold:#f5c04a;--line:#2b1d16}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',system-ui,sans-serif;font-weight:800;background:linear-gradient(180deg,var(--night),var(--night2));color:var(--cream);min-height:100vh;padding:24px 14px 40px}
.wrap{max-width:680px;margin:0 auto}
.warn{background:rgba(245,192,74,.14);border:2px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:900;color:var(--gold);margin-bottom:16px;text-align:center}
h1{font-family:'Luckiest Guy',cursive;font-size:32px;color:var(--green);text-shadow:2px 2px 0 var(--line);margin-bottom:4px}
p.sub{font-size:14px;color:rgba(255,244,214,.7);margin-bottom:16px}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.card{flex:1;min-width:115px;background:var(--cream);color:var(--ink);border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line);padding:10px;text-align:center}
.card img{width:50px;height:50px;border-radius:50%;border:2px solid var(--line);object-fit:cover;display:block;margin:0 auto 6px}
.card .n{font-family:'Luckiest Guy',cursive;font-size:14px;color:var(--ink)}
.card .q{font-size:20px;font-weight:900;color:var(--orange)}
table{width:100%;border-collapse:collapse;background:var(--cream);color:var(--ink);border:3px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 4px 0 var(--line)}
th,td{padding:9px 10px;text-align:left;font-size:14px;border-bottom:2px solid #e8d9b0}
th{background:var(--gold);font-size:11px;letter-spacing:1px;text-transform:uppercase}
tr:last-child td{border-bottom:none}
td img{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);object-fit:cover;vertical-align:middle;margin-right:6px}
.actions{display:flex;gap:10px;margin-top:18px}
button{flex:1;font-family:'Nunito',sans-serif;font-weight:900;font-size:15px;color:#fff;background:var(--green);border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line);padding:12px;cursor:pointer}
button.ghost{background:#fff;color:var(--ink)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.empty{text-align:center;color:rgba(255,244,214,.6);padding:28px 10px;font-size:14px;line-height:1.5}
.gate{background:var(--cream);color:var(--ink);border:3px solid var(--line);border-radius:16px;box-shadow:0 5px 0 var(--line);padding:18px;text-align:center}
.gate input{width:100%;font-family:'Nunito',sans-serif;font-weight:900;font-size:17px;color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:12px;box-shadow:0 4px 0 var(--line);padding:11px 12px;outline:none;text-align:center;margin:12px 0}
.gate input:focus{border-color:var(--green-dark)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--cream);font-weight:900;font-size:14px;padding:10px 18px;border-radius:999px;border:2px solid var(--gold);transition:transform .25s ease;z-index:60;opacity:0}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="warn">🔒 Painel interno — não divulgue este link</div>
  <h1>Painel da Turma 🐾</h1>
  <p class="sub">Os resultados chegam aqui na hora em que cada convidado termina o quiz.</p>
  <div id="gate" class="gate">
    <div style="font-weight:900;font-size:15px">🔑 Código do painel</div>
    <input id="inp-code" type="password" placeholder="Digite o código…" autocomplete="off">
    <button id="btn-go">Entrar</button>
  </div>
  <div id="content" hidden>
    <p class="sub" id="meta">Carregando…</p>
    <div class="cards" id="cards"></div>
    <div id="list"></div>
    <div class="actions">
      <button id="btn-copy">📋 Copiar resumo</button>
      <button class="ghost" id="btn-refresh">↻ Atualizar</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
(function(){
  "use strict";
  var API_URL=''; // preencher após deploy do worker — igual à do quiz (festa/index.html)
  var CHARS=[
    {k:"Salsicha",img:"../img/faces/salsicha.png"},
    {k:"Scooby-Doo",img:"../img/faces/scooby.png"},
    {k:"Velma",img:"../img/faces/velma.png"},
    {k:"Fred",img:"../img/faces/fred.png"},
    {k:"Daphne",img:"../img/faces/daphne.png"}
  ];
  var gate=document.getElementById('gate');
  var content=document.getElementById('content');
  var meta=document.getElementById('meta');
  var cardsEl=document.getElementById('cards');
  var listEl=document.getElementById('list');

  function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
  function fmtDate(iso){
    try{var d=new Date(iso);return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' · '+d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}catch(e){return '';}
  }
  function toast(m){
    var t=document.getElementById('toast');
    t.textContent=m;t.classList.add('show');
    clearTimeout(window._tt);
    window._tt=setTimeout(function(){t.classList.remove('show');},2400);
  }

  function load(){
    if(!API_URL){listEl.innerHTML='<div class="empty">Painel ainda sem endpoint conectado.<br>Assim que o servidorzinho (worker) for pro ar, os resultados aparecem aqui.</div>';meta.textContent='Aguardando endpoint…';return;}
    fetch(API_URL+'/list?code='+encodeURIComponent(sessionStorage.getItem('painelCode')||''))
      .then(function(r){if(r.status===403) throw 'code';if(!r.ok) throw 'err';return r.json();})
      .then(function(rows){
        meta.textContent=rows.length+' convidado'+(rows.length===1?'':'s')+' já fez o quiz';
        var counts=[0,0,0,0,0];
        rows.forEach(function(r){counts[r.char]++;});
        cardsEl.innerHTML=CHARS.map(function(c,i){
          return '<div class="card"><img src="'+c.img+'"><div class="n">'+c.k+'</div><div class="q">'+(counts[i]||0)+'</div></div>';
        }).join('');
        var html='<table><tr><th>Nome</th><th>Personagem</th><th>Hora</th></tr>';
        rows.slice().reverse().forEach(function(r){
          html+='<tr><td>'+esc(r.name)+'</td><td><img src="'+CHARS[r.char].img+'">'+CHARS[r.char].k+'</td><td>'+fmtDate(r.at)+'</td></tr>';
        });
        html+='</table>';
        listEl.innerHTML=html;
        window._rows=rows;
      })
      .catch(function(e){
        if(e==='code'){gate.hidden=false;content.hidden=true;sessionStorage.removeItem('painelCode');toast('Código errado');}
        else listEl.innerHTML='<div class="empty">Não consegui falar com o servidor.<br>Tenta o Atualizar daqui a pouco.</div>';
      });
  }

  document.getElementById('btn-go').addEventListener('click',function(){
    var code=document.getElementById('inp-code').value.trim();
    if(!code) return;
    sessionStorage.setItem('painelCode',code);
    gate.hidden=true;content.hidden=false;
    load();
  });
  document.getElementById('inp-code').addEventListener('keydown',function(ev){
    if(ev.key==='Enter') document.getElementById('btn-go').click();
  });
  document.getElementById('btn-refresh').addEventListener('click',load);

  function copySummary(){
    if(!window._rows||!window._rows.length){toast('Nada pra copiar ainda');return;}
    var counts=[0,0,0,0,0];
    window._rows.forEach(function(r){counts[r.char]++;});
    var lines=['🎉 A Turma de Hoje — Theo faz 7 anos!! 🐾',''];
    CHARS.forEach(function(c,i){if(counts[i])lines.push('• '+c.k+': '+counts[i]);});
    lines.push('','Eu sou '+CHARS[window._rows[window._rows.length-1].char].k+'! E você?');
    var txt=lines.join('\n');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast('Resumo copiado! 📋');},function(){fallback(txt);});
    }else{fallback(txt);}
  }
  function fallback(t){
    var ta=document.createElement('textarea');ta.value=t;
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);toast('Resumo copiado! 📋');
  }
  document.getElementById('btn-copy').addEventListener('click',copySummary);

  if(sessionStorage.getItem('painelCode')){gate.hidden=true;content.hidden=false;load();}
})();
</script>
</body>
</html>
